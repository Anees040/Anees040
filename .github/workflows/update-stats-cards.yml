name: Update GitHub Profile Cards

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-stats-cards.yml'

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output

      - name: Generate reliable GitHub stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from xml.sax.saxutils import escape

          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          user = get("https://api.github.com/users/Anees040")
          repos = get("https://api.github.com/users/Anees040/repos?per_page=100&type=owner")

          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          following = user.get("following", 0)
          stars = sum(repo.get("stargazers_count", 0) for repo in repos)

          def card_value(x):
              return f"{x:,}"

          svg = f'''<svg width="576" height="220" viewBox="0 0 576 220" xmlns="http://www.w3.org/2000/svg">
          <rect width="576" height="220" rx="10" fill="#1a1b27"/>
          <style>
            .title {{ font: 700 20px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }}
            .value {{ font: 700 25px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }}
            .label {{ font: 500 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }}
          </style>
          <text x="28" y="38" class="title">GitHub Stats</text>
          <line x1="28" y1="55" x2="548" y2="55" stroke="#30334a"/>

          <text x="45" y="94" class="value">{card_value(public_repos)}</text>
          <text x="45" y="116" class="label">Public Repositories</text>

          <text x="310" y="94" class="value">{card_value(stars)}</text>
          <text x="310" y="116" class="label">Total Stars</text>

          <text x="45" y="158" class="value">{card_value(followers)}</text>
          <text x="45" y="180" class="label">Followers</text>

          <text x="310" y="158" class="value">{card_value(following)}</text>
          <text x="310" y="180" class="label">Following</text>
          </svg>'''

          with open("stats.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Generate top languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Anees040&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Anees040&theme=tokyonight&hide_border=true&disable_animations=true
          path: streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove unused activity graph
        run: rm -f activity.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg streak.svg activity.svg
          git diff --staged --quiet || git commit -m "Fix GitHub profile cards and remove activity graph"
          git push origin output
