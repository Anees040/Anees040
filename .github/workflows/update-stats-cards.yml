name: Update Stats Cards

on:
  push:
    paths:
      - '.github/workflows/update-stats-cards.yml'  # runs once immediately when you add this file
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours after that
  workflow_dispatch:        # lets you trigger it manually from the Actions tab anytime

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output

      - name: Fetch GitHub Stats card
        run: |
          curl -sf "https://github-stats-extended.vercel.app/api?username=Anees040&show_icons=true&theme=tokyonight&hide_border=true&count_private=true" -o stats.svg.new \
            && mv stats.svg.new stats.svg \
            || echo "Stats fetch failed — keeping previous version"

      - name: Fetch Top Languages card
        run: |
          curl -sf "https://github-stats-extended.vercel.app/api/top-langs/?username=Anees040&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" -o top-langs.svg.new \
            && mv top-langs.svg.new top-langs.svg \
            || echo "Top-langs fetch failed — keeping previous version"

      - name: Fetch Streak Stats card
        run: |
          curl -sf "https://streak-stats.demolab.com?user=Anees040&theme=tokyonight&hide_border=true" -o streak.svg.new \
            && mv streak.svg.new streak.svg \
            || echo "Streak fetch failed — keeping previous version"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in stats.svg top-langs.svg streak.svg; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "$f was not fetched this run — skipping"
            fi
          done
          git diff --staged --quiet || git commit -m "Auto-update stats cards"
          git push
